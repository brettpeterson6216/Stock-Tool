# Keeps impliedlens.com awake on Render's free plan.
#
# Render puts a free service to sleep after 15 minutes without traffic, and
# the next visitor waits about a minute for it to wake. This job visits the
# site every 5 minutes so it never reaches that idle window. GitHub's
# scheduler can run a few minutes late under load, which is why the interval
# is well inside 15 minutes.
#
# Render's free plan includes 750 instance hours a month, enough for one
# service to run around the clock. Delete this file once the site moves to a
# paid instance, which never sleeps.
#
# Note: GitHub pauses scheduled workflows in a public repo after 60 days
# with no commits. Run it by hand from the Actions tab to re-enable it.
name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the site
        run: |
          for url in "https://impliedlens.com/api/version" "https://impliedlens.com/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 --max-time 90 "$url" || echo "000")
            echo "$url -> $code"
          done
