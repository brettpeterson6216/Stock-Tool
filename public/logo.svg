<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Implied Lens">
  <!--
    Monoline mark, drawn for 16-32px.

    The previous mark packed 35 elements into the same space: a dark
    background plate, two gradient rings, eight aperture ticks, six
    candlesticks with wicks, a baseline and a blurred glint. At the 28px it
    actually renders, a candle body measured 0.98px and its wick 0.21px, so
    most of it resolved to grey smear rather than shape.

    This is three shapes: the lens, the line it reveals, and the point of
    focus. No background plate, so it sits on whatever the page is; no blur
    filter, because Gaussian blur at icon size is mud; one stroke weight, so
    it stays even when scaled.
  -->
  <g fill="none" stroke="#D7A33F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="12"/>
    <path d="M9.4 20.2 L13.6 15.4 L17.2 18 L22.6 11.2"/>
  </g>
  <circle cx="22.6" cy="11.2" r="2.4" fill="#D7A33F"/>
</svg>
